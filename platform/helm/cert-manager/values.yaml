# cert-manager — TLS certificate automation
# CRDs are installed via --set installCRDs=true in scripts/install-platform.sh.

replicaCount: 1

resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    memory: 128Mi

securityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

prometheus:
  enabled: false

webhook:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi

cainjector:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
