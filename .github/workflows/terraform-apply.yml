name: terraform-apply

# Applies the dev environment. Manual trigger only - requires a live Azure
# subscription wired up via the ARM_* and TF_BACKEND_* repository secrets.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  plan:
    runs-on: ubuntu-latest
    env:
      TF_IN_AUTOMATION: 1
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ secrets.ARM_CLIENT_ID }}","clientSecret":"${{ secrets.ARM_CLIENT_SECRET }}","subscriptionId":"${{ secrets.ARM_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.ARM_TENANT_ID }}"}'

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: latest

      - name: Verify backend secrets
        run: |
          if [ -z "${{ secrets.TF_BACKEND_RESOURCE_GROUP }}" ] || \
             [ -z "${{ secrets.TF_BACKEND_STORAGE_ACCOUNT }}" ] || \
             [ -z "${{ secrets.TF_BACKEND_CONTAINER }}" ] || \
             [ -z "${{ secrets.TF_BACKEND_KEY }}" ]; then
            echo "Missing backend secrets. Set TF_BACKEND_RESOURCE_GROUP, TF_BACKEND_STORAGE_ACCOUNT, TF_BACKEND_CONTAINER, TF_BACKEND_KEY." >&2
            exit 1
          fi

      - name: Terraform init (dev)
        working-directory: terraform/environments/dev
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=${{ secrets.TF_BACKEND_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ secrets.TF_BACKEND_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ secrets.TF_BACKEND_CONTAINER }}" \
            -backend-config="key=${{ secrets.TF_BACKEND_KEY }}"

      - name: Terraform plan (dev)
        working-directory: terraform/environments/dev
        run: terraform plan -input=false -no-color -out=tfplan

      - uses: actions/upload-artifact@v4
        with:
          name: tfplan-dev
          path: terraform/environments/dev/tfplan

  apply:
    needs: plan
    runs-on: ubuntu-latest
    environment: production
    concurrency: terraform-apply-dev
    env:
      TF_IN_AUTOMATION: 1
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: latest

      - name: Verify backend secrets
        run: |
          if [ -z "${{ secrets.TF_BACKEND_RESOURCE_GROUP }}" ] || \
             [ -z "${{ secrets.TF_BACKEND_STORAGE_ACCOUNT }}" ] || \
             [ -z "${{ secrets.TF_BACKEND_CONTAINER }}" ] || \
             [ -z "${{ secrets.TF_BACKEND_KEY }}" ]; then
            echo "Missing backend secrets. Set TF_BACKEND_RESOURCE_GROUP, TF_BACKEND_STORAGE_ACCOUNT, TF_BACKEND_CONTAINER, TF_BACKEND_KEY." >&2
            exit 1
          fi

      - name: Terraform init (dev)
        working-directory: terraform/environments/dev
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=${{ secrets.TF_BACKEND_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ secrets.TF_BACKEND_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ secrets.TF_BACKEND_CONTAINER }}" \
            -backend-config="key=${{ secrets.TF_BACKEND_KEY }}"

      - name: Reconcile existing network resources
        run: bash scripts/reconcile-dev.sh

      - uses: actions/download-artifact@v4
        with:
          name: tfplan-dev
          path: terraform/environments/dev

      - name: Terraform apply (dev)
        working-directory: terraform/environments/dev
        run: terraform apply -input=false -no-color tfplan
