name: Security PR Scan

on:
  pull_request:
    branches: [main]
    paths:
      - "terraform/**"
      - "platform/**"
      - ".github/workflows/**"

# Limit to one run per PR — cancel in-progress on new push
concurrency:
  group: security-scan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write      # needed to post PR comment
  security-events: write    # needed to upload SARIF to GitHub Security tab

jobs:
  # ── Job 1: tfsec ────────────────────────────────────────────────────────────
  tfsec:
    name: tfsec (Terraform)
    runs-on: ubuntu-latest
    outputs:
      outcome: ${{ steps.scan.outcome }}
      summary: ${{ steps.summary.outputs.text }}

    steps:
      - uses: actions/checkout@v4

      - name: Run tfsec
        id: scan
        uses: aquasecurity/tfsec-action@v1.0.3
        continue-on-error: true
        with:
          working_directory: terraform
          soft_fail: true
          format: json
          additional_args: >
            --minimum-severity HIGH
            --out tfsec-results.json

      - name: Parse tfsec results
        id: summary
        if: always()
        run: |
          if [ -f tfsec-results.json ]; then
            CRITICAL=$(jq '[.results[] | select(.severity=="CRITICAL")] | length' tfsec-results.json 2>/dev/null || echo 0)
            HIGH=$(jq '[.results[] | select(.severity=="HIGH")] | length' tfsec-results.json 2>/dev/null || echo 0)
            MEDIUM=$(jq '[.results[] | select(.severity=="MEDIUM")] | length' tfsec-results.json 2>/dev/null || echo 0)
            LOW=$(jq '[.results[] | select(.severity=="LOW")] | length' tfsec-results.json 2>/dev/null || echo 0)
            TOTAL=$(jq '.results | length' tfsec-results.json 2>/dev/null || echo 0)

            if [ "$CRITICAL" -gt 0 ] || [ "$HIGH" -gt 0 ]; then
              STATUS="❌ FAILED"
            else
              STATUS="✅ PASSED"
            fi

            TEXT="**tfsec** — ${STATUS}
          | Severity | Count |
          |----------|-------|
          | 🔴 Critical | ${CRITICAL} |
          | 🟠 High | ${HIGH} |
          | 🟡 Medium | ${MEDIUM} |
          | 🟢 Low | ${LOW} |
          | **Total** | **${TOTAL}** |"
          else
            TEXT="**tfsec** — ✅ No issues found"
          fi

          echo "text<<EOF" >> $GITHUB_OUTPUT
          echo "$TEXT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Upload tfsec SARIF
        if: always()
        uses: aquasecurity/tfsec-action@v1.0.3
        continue-on-error: true
        with:
          working_directory: terraform
          soft_fail: true
          format: sarif
          additional_args: --minimum-severity HIGH --out tfsec-results.sarif

      - name: Upload SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: tfsec-results.sarif
          category: tfsec

  # ── Job 2: Checkov ──────────────────────────────────────────────────────────
  checkov:
    name: Checkov (Terraform + Kubernetes)
    runs-on: ubuntu-latest
    outputs:
      outcome: ${{ steps.scan.outcome }}
      summary: ${{ steps.summary.outputs.text }}

    steps:
      - uses: actions/checkout@v4

      - name: Run Checkov
        id: scan
        uses: bridgecrewio/checkov-action@v12
        continue-on-error: true
        with:
          directory: .
          framework: terraform,kubernetes
          output_format: json
          output_file_path: checkov-results.json
          soft_fail: true
          skip_check: >-
            CKV_AZURE_141,CKV2_AZURE_2
          # CKV_AZURE_141: AKS AAD admin group — optional for portfolio
          # CKV2_AZURE_2:  AKS auth range — handled by private cluster

      - name: Parse Checkov results
        id: summary
        if: always()
        run: |
          if [ -f checkov-results.json ]; then
            PASSED=$(jq '[.[] | .summary.passed] | add // 0' checkov-results.json 2>/dev/null || echo 0)
            FAILED=$(jq '[.[] | .summary.failed] | add // 0' checkov-results.json 2>/dev/null || echo 0)
            SKIPPED=$(jq '[.[] | .summary.skipped] | add // 0' checkov-results.json 2>/dev/null || echo 0)

            if [ "$FAILED" -gt 0 ]; then
              STATUS="❌ FAILED"
            else
              STATUS="✅ PASSED"
            fi

            TEXT="**Checkov** — ${STATUS}
          | Result | Count |
          |--------|-------|
          | ✅ Passed | ${PASSED} |
          | ❌ Failed | ${FAILED} |
          | ⏭️ Skipped | ${SKIPPED} |"
          else
            TEXT="**Checkov** — ✅ No issues found"
          fi

          echo "text<<EOF" >> $GITHUB_OUTPUT
          echo "$TEXT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Upload Checkov SARIF
        if: always()
        uses: bridgecrewio/checkov-action@v12
        continue-on-error: true
        with:
          directory: .
          framework: terraform,kubernetes
          output_format: sarif
          output_file_path: checkov-results.sarif
          soft_fail: true
          skip_check: CKV_AZURE_141,CKV2_AZURE_2

      - name: Upload SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: checkov-results.sarif
          category: checkov

  # ── Job 3: Falco config & YAML linting ────────────────────────────────────────
  falco-lint:
    name: Falco config & YAML lint
    runs-on: ubuntu-latest
    outputs:
      outcome: ${{ steps.lint.outcome }}
      summary: ${{ steps.summary.outputs.text }}

    steps:
      - uses: actions/checkout@v4

      - name: Install yamllint
        run: pip install yamllint --quiet

      - name: Lint Falco values.yaml
        id: lint
        continue-on-error: true
        run: |
          echo "=== Validating Falco Helm values ==="
          yamllint -d "{extends: relaxed, rules: {line-length: {max: 150}}}" \
            platform/helm/falco/values.yaml

          echo "=== Validating all platform YAML files ==="
          find platform/ -name "*.yaml" -o -name "*.yml" | \
            xargs yamllint -d "{extends: relaxed, rules: {line-length: {max: 150}}}"

          echo "=== Checking required Falco security keys are present ==="
          python3 - <<'PYEOF'
          import yaml, sys

          with open("platform/helm/falco/values.yaml") as f:
              values = yaml.safe_load(f)

          required_keys = ["driver", "falco", "falcosidekick"]
          missing = [k for k in required_keys if k not in values]

          if missing:
              print(f"ERROR: Missing required keys in falco/values.yaml: {missing}")
              sys.exit(1)

          driver_kind = values.get("driver", {}).get("kind", "")
          if driver_kind not in ["ebpf", "modern_ebpf", "kmod"]:
              print(f"WARNING: Unexpected driver.kind: {driver_kind}")

          json_output = values.get("falco", {}).get("json_output", False)
          if not json_output:
              print("WARNING: falco.json_output is not enabled — alerts may not parse correctly")

          print(f"driver.kind: {driver_kind} ✓")
          print(f"falco.json_output: {json_output} ✓")
          print(f"falcosidekick enabled: {values.get('falcosidekick', {}).get('enabled', False)} ✓")
          print("All required Falco keys present ✓")
          PYEOF

      - name: Build summary
        id: summary
        if: always()
        run: |
          if [ "${{ steps.lint.outcome }}" = "success" ]; then
            TEXT="**Falco rule lint** — ✅ PASSED
          All Falco configuration and platform YAML files are valid"
          else
            TEXT="**Falco rule lint** — ❌ FAILED
          One or more Falco rules or YAML files failed validation — check the job logs"
          fi

          echo "text<<EOF" >> $GITHUB_OUTPUT
          echo "$TEXT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

  # ── Job 4: Post PR comment ──────────────────────────────────────────────────
  pr-comment:
    name: Post security summary
    runs-on: ubuntu-latest
    needs: [tfsec, checkov, falco-lint]
    if: always() && github.event_name == 'pull_request'

    steps:
      - name: Post or update PR comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const tfsecOutcome    = "${{ needs.tfsec.outputs.outcome }}";
            const checkovOutcome  = "${{ needs.checkov.outputs.outcome }}";
            const falcoOutcome    = "${{ needs.falco-lint.outputs.outcome }}";

            const tfsecSummary   = `${{ needs.tfsec.outputs.summary }}`;
            const checkovSummary = `${{ needs.checkov.outputs.summary }}`;
            const falcoSummary   = `${{ needs.falco-lint.outputs.summary }}`;

            const allPassed = (
              tfsecOutcome   !== "failure" &&
              checkovOutcome !== "failure" &&
              falcoOutcome   !== "failure"
            );

            const overallStatus = allPassed
              ? "✅ All security checks passed"
              : "❌ One or more security checks failed — review findings below";

            const runUrl = `https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}`;

            const body = [
              "<!-- security-scan-comment -->",
              "## 🔐 Security Scan Results",
              "",
              `**${overallStatus}**`,
              "",
              "---",
              "",
              tfsecSummary,
              "",
              "---",
              "",
              checkovSummary,
              "",
              "---",
              "",
              falcoSummary,
              "",
              "---",
              "",
              `> Scanned commit \`${{ github.event.pull_request.head.sha }}\` — [View full run](${runUrl})`,
              "> Results also uploaded to the [Security tab](https://github.com/${{ github.repository }}/security/code-scanning).",
            ].join("\n");

            const marker = "<!-- security-scan-comment -->";
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
              console.log("Updated existing security comment");
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
              console.log("Created new security comment");
            }
