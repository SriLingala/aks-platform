name: terraform-destroy

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  destroy:
    runs-on: ubuntu-latest
    environment: production
    concurrency: terraform-destroy-dev
    env:
      TF_IN_AUTOMATION: 1
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: latest

      - name: Verify backend secrets
        run: |
          if [ -z "${{ secrets.TF_BACKEND_RESOURCE_GROUP }}" ] || \
             [ -z "${{ secrets.TF_BACKEND_STORAGE_ACCOUNT }}" ] || \
             [ -z "${{ secrets.TF_BACKEND_CONTAINER }}" ] || \
             [ -z "${{ secrets.TF_BACKEND_KEY }}" ]; then
            echo "Missing backend secrets. Set TF_BACKEND_RESOURCE_GROUP, TF_BACKEND_STORAGE_ACCOUNT, TF_BACKEND_CONTAINER, TF_BACKEND_KEY." >&2
            exit 1
          fi

      - uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ secrets.ARM_CLIENT_ID }}","clientSecret":"${{ secrets.ARM_CLIENT_SECRET }}","subscriptionId":"${{ secrets.ARM_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.ARM_TENANT_ID }}"}'

      - name: Check backend exists
        id: backend
        run: |
          if [ "$(az group exists -n "${{ secrets.TF_BACKEND_RESOURCE_GROUP }}")" != "true" ]; then
            echo "Backend resource group not found; skipping destroy."
            echo "exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! az storage account show \
              --resource-group "${{ secrets.TF_BACKEND_RESOURCE_GROUP }}" \
              --name "${{ secrets.TF_BACKEND_STORAGE_ACCOUNT }}" \
              >/dev/null 2>&1; then
            echo "Backend storage account not found; skipping destroy."
            echo "exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "exists=true" >> "$GITHUB_OUTPUT"

      - name: Terraform init (dev)
        if: steps.backend.outputs.exists == 'true'
        working-directory: terraform/environments/dev
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=${{ secrets.TF_BACKEND_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ secrets.TF_BACKEND_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ secrets.TF_BACKEND_CONTAINER }}" \
            -backend-config="key=${{ secrets.TF_BACKEND_KEY }}"

      - name: Terraform destroy (dev)
        if: steps.backend.outputs.exists == 'true'
        working-directory: terraform/environments/dev
        run: terraform destroy -input=false -auto-approve
