name: terraform-destroy-bootstrap

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  destroy:
    runs-on: ubuntu-latest
    environment: production
    concurrency: terraform-destroy-bootstrap
    env:
      TF_IN_AUTOMATION: 1
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: latest

      - name: Terraform init (bootstrap)
        working-directory: terraform/environments/bootstrap
        run: terraform init -input=false

      - name: Terraform destroy (bootstrap)
        working-directory: terraform/environments/bootstrap
        run: terraform destroy -input=false -auto-approve -var-file=terraform.tfvars.example
